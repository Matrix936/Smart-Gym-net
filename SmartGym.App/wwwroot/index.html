<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Smart Gym</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="subnav.css" />
    <link rel="icon" href="data:,">
    <script>
        // Tema persistente — aplicar antes del primer paint (v1 usaba localStorage;
        // en MAUI se migrará a Preferences vía interop).
        (function () {
            var theme = localStorage.getItem('sg-theme');
            if (theme !== 'light') theme = 'dark';
            document.documentElement.dataset.theme = theme;
        })();

        window.sgTheme = {
            get: function () { return document.documentElement.dataset.theme || 'dark'; },
            set: function (theme) {
                document.documentElement.dataset.theme = theme;
                localStorage.setItem('sg-theme', theme);
            },
            toggle: function () {
                var next = this.get() === 'dark' ? 'light' : 'dark';
                this.set(next);
                return next;
            }
        };

        window.sgUi = {
            focus: function (selector) {
                var el = document.querySelector(selector);
                if (el) el.focus();
            },
            // POS: tras un toque con puntero en una tarjeta, soltar el foco para
            // que Enter signifique "cobrar" y no volver a agregar el producto.
            // (La activación por teclado de la tarjeta llama a esto con Detail=0,
            // o sea que nunca llega acá — ver PosPage.AgregarAlCarritoAsync.)
            blurActivo: function () {
                var el = document.activeElement;
                if (el && el !== document.body && el.blur) el.blur();
            },
            // POS: listener global de atajos (se registra al montar PosPage y se
            // libera al navegar). Ignora la tecla cuando el foco está en controles
            // interactivos: campos de texto (búsqueda/socio), selects (sede/método),
            // botones (Cobrar/cantidad) y las propias tarjetas (data-sg-pos-captura,
            // donde Enter/Espacio ya agregan vía el click nativo del botón).
            posAtajos: function (dotnetRef) {
                if (window.__sgPosDispose) window.__sgPosDispose();
                if (!dotnetRef) return;
                var handler = function (e) {
                    var activo = document.activeElement;
                    if (activo && activo.closest &&
                        activo.closest('input, textarea, select, button, a, [contenteditable], [data-sg-pos-captura]')) return;
                    if (e.key !== 'Enter' && e.key !== '+' && e.key !== '=' && e.key !== '-' && e.key !== '_') return;
                    dotnetRef.invokeMethodAsync('OnAtajoPos', e.key);
                };
                window.addEventListener('keydown', handler);
                window.__sgPosDispose = function () {
                    window.removeEventListener('keydown', handler);
                    window.__sgPosDispose = null;
                };
            },
            // POS: lector de código de barras USB (keyboard wedge). El lector
            // "teclea" los caracteres del código muy rápido (10-30 ms entre
            // teclas) y termina con Enter (o Tab, según configuración). Este
            // listener observa en FASE DE CAPTURA — sin el filtro de inputs de
            // posAtajos — porque el escaneo debe funcionar sin importar qué
            // campo tenga el foco (buscador, socio, cualquier otro).
            //
            // Detección: bufferiza imprimibles con timestamp; si hay una pausa
            // humana (> MAX_GAP_MS) resetea. Al llegar Enter/Tab evalúa: si
            // califica (longitud mínima + terminador inmediato), es escáner →
            // preventDefault (que ese Enter no dispare "Cobrar" ni un submit),
            // limpia lo que el escaneo haya dejado escrito en el campo con
            // foco, y entrega el código a .NET. Si no califica, no toca nada:
            // la escritura humana y los atajos existentes fluyen igual.
            scanner: function (dotnetRef) {
                if (window.__sgScannerDispose) window.__sgScannerDispose();
                if (!dotnetRef) return;
                // --- Constantes de detección (ajustables) ---
                var MAX_GAP_MS = 65;   // máx intervalo entre teclas del escaneo
                var MIN_CHARS = 6;     // mínima longitud del código
                var MAX_TERM_MS = 100; // terminador <= 100 ms tras la última tecla

                var buffer = [];
                var lastTs = 0;

                var handler = function (e) {
                    var ahora = performance.now();

                    // Atajos con modificador: jamás forman parte de un escaneo.
                    if (e.ctrlKey || e.metaKey || e.altKey) {
                        buffer = [];
                        lastTs = 0;
                        return;
                    }

                    if (e.key === 'Enter' || e.key === 'Tab') {
                        if (buffer.length >= MIN_CHARS && lastTs > 0 && (ahora - lastTs) <= MAX_TERM_MS) {
                            var codigo = buffer.join('');
                            buffer = [];
                            lastTs = 0;
                            // Consume el terminador: ni "Cobrar", ni submit
                            // de formulario, ni salto de foco por Tab.
                            e.preventDefault();
                            e.stopPropagation();
                            // El escaneo dejó caracteres en el campo con foco:
                            // límpialos y avisa a Blazor (el bind escucha input).
                            var activo = document.activeElement;
                            if (activo && 'value' in activo && activo.value) {
                                activo.value = '';
                                activo.dispatchEvent(new Event('input', { bubbles: true }));
                            }
                            dotnetRef.invokeMethodAsync('OnCodigoEscaneado', codigo);
                            return;
                        }
                        buffer = [];
                        lastTs = 0;
                        return;
                    }

                    if (e.key.length === 1) {
                        if (lastTs > 0 && (ahora - lastTs) > MAX_GAP_MS) {
                            buffer = []; // pausa humana: lo anterior no es escaneo
                        }
                        buffer.push(e.key);
                        lastTs = ahora;
                    }
                    // Teclas no imprimibles (Shift, flechas, F1-F12...) no
                    // rompen un escaneo en curso ni se bufferizan.
                };

                window.addEventListener('keydown', handler, true);
                window.__sgScannerDispose = function () {
                    window.removeEventListener('keydown', handler, true);
                    window.__sgScannerDispose = null;
                };
            }
        };

        window.sgFile = {
            initDropZone: function () {
                var el = document.querySelector('.logo-dropzone');
                if (!el || el.__sgInit) return;
                el.__sgInit = true;
                console.log('[sgFile] initDropZone vinculado');
                ['dragenter', 'dragover'].forEach(function (ev) {
                    el.addEventListener(ev, function (e) {
                        e.preventDefault();
                        e.stopPropagation();
                        if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types, 'Files') !== -1) {
                            DotNet.invokeMethodAsync('SmartGym.App', 'SetDraggingStatic', true);
                        }
                    });
                });
                ['dragleave', 'drop'].forEach(function (ev) {
                    el.addEventListener(ev, function (e) {
                        e.preventDefault();
                        e.stopPropagation();
                        DotNet.invokeMethodAsync('SmartGym.App', 'SetDraggingStatic', false);
                    });
                });
                el.addEventListener('drop', function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    var files = e.dataTransfer && e.dataTransfer.files;
                    if (!files || files.length === 0) return;
                    var file = files[0];
                    console.log('[sgFile] drop', file.name, file.size);
                    var reader = new FileReader();
                    reader.onload = function (event) {
                        console.log('[sgFile] leido ok', file.name);
                        DotNet.invokeMethodAsync('SmartGym.App', 'OnFileDroppedStatic', event.target.result, file.type || '', file.size, file.name);
                    };
                    reader.onerror = function (event) {
                        console.log('[sgFile] error lectura', file.name, event);
                    };
                    reader.readAsDataURL(file);
                });
            },
            // Arrastre nativo (WinUI → Blazor). WebView2 no entrega dragover/drop
            // HTML5 para archivos del SO, así que el host lo engancha a nivel nativo.
            setExternalDrag: function (on) {
                if (on && !document.querySelector('.logo-dropzone')) return;
                DotNet.invokeMethodAsync('SmartGym.App', 'SetDraggingStatic', !!on);
            },
            setExternalDrop: function (p) {
                if (!document.querySelector('.logo-dropzone')) return;
                console.log('[sgFile] drop nativo', p.name, p.size);
                DotNet.invokeMethodAsync('SmartGym.App', 'OnFileDroppedStatic', p.dataUrl, p.mime, p.size, p.name);
            },
        };
        // Bloqueo por inactividad del sistema administrativo (MainLayout).
        // El listener vive SOLO en la ventana admin; el Kiosco abre otra
        // ventana con RootComponent propio y nunca lo registra.
        window.sgIdle = {
            _timer: null,
            _dotnet: null,
            _minutos: 5,
            _eventos: ['pointerdown', 'keydown', 'wheel', 'touchstart'],
            _handler: null,
            iniciar: function (dotnetRef, minutos) {
                this.dispose();
                this._dotnet = dotnetRef;
                this._minutos = minutos;
                var self = this;
                this._handler = function () { self.rearmar(); };
                this._eventos.forEach(function (ev) {
                    document.addEventListener(ev, self._handler, { passive: true });
                });
                this.rearmar();
            },
            // Reinicia el contador (cada actividad + cada navegación).
            rearmar: function () {
                if (!this._dotnet) return;
                if (this._timer) clearTimeout(this._timer);
                var self = this;
                this._timer = setTimeout(function () {
                    self._dotnet.invokeMethodAsync('OnInactividadTotal');
                }, self._minutos * 60 * 1000);
            },
            dispose: function () {
                if (this._timer) clearTimeout(this._timer);
                this._timer = null;
                var self = this;
                if (this._handler) {
                    this._eventos.forEach(function (ev) {
                        document.removeEventListener(ev, self._handler);
                    });
                }
                this._handler = null;
                this._dotnet = null;
            }
        };

    </script>
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">
        <div class="sg-boot">
            <div class="sg-boot-dots" aria-label="Cargando"><span></span><span></span><span></span></div>
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
